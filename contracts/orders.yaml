# ODCS v3.2 contract for the TPC-H seed table `polaris.sales.orders`
# (oracle: TPC-H dbgen; types as Trino/Iceberg exposes them).
# aster reads name/id, team.name, schema[].properties[] and semanticType.
version: 3.2.0
apiVersion: v3.2.0
kind: DataContract
id: orders
name: orders
status: active
description: one row per customer order
team:
  name: data-team
domain: sales
schema:
  - name: orders
    logicalType: object
    properties:
      - name: orderkey
        logicalType: bigint
        required: true
        primaryKey: true
        semanticType: column
      - name: custkey
        logicalType: bigint
        required: true
        semanticType: dimension
      - name: orderstatus
        logicalType: varchar
        semanticType: dimension
      - name: totalprice
        logicalType: double
        semanticType: measure
      - name: orderdate
        logicalType: date
        semanticType: dimension
      - name: orderpriority
        logicalType: varchar
        semanticType: dimension
      - name: clerk
        logicalType: varchar
        semanticType: dimension
      - name: shippriority
        logicalType: integer
        semanticType: measure
      - name: comment
        logicalType: varchar
        semanticType: dimension
