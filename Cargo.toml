[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/engines",
    "crates/catalogs",
    "crates/server",
    "crates/controller",
    "crates/tui",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["trace", "cors"] }
ratatui = "0.29"
base64 = "0.22"
getrandom = "0.3"
openidconnect = "4"
redis = { version = "1.7", features = ["tokio-comp"] }
buffa = "0.9"
connectrpc = { version = "0.9", features = ["axum"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace"] }
tracing-opentelemetry = "0.33"
prometheus-client = "0.25"
prometheus-client-derive-encode = "0.5"

aster-core = { path = "crates/core" }
aster-engines = { path = "crates/engines" }
aster-catalogs = { path = "crates/catalogs" }
