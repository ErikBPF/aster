[package]
name = "aster-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
aster-core.workspace = true
aster-engines.workspace = true
aster-catalogs.workspace = true
async-trait.workspace = true
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "macros", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
libc = "0.2"
# Official draft-2019-09 validation; network/file reference features are disabled.
jsonschema = { version = "=0.58.2", default-features = false }
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
base64.workspace = true
ring = "0.17"
chrono = "0.4"
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
redis.workspace = true
buffa.workspace = true
connectrpc.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
prometheus-client.workspace = true
prometheus-client-derive-encode.workspace = true

[build-dependencies]
connectrpc-build = "0.9"

[dev-dependencies]
serde_norway.workspace = true
cucumber = "0.23"
async-trait.workspace = true
tower = "0.5"
futures.workspace = true
tokio-rustls = "0.26"
tempfile = "3"

# The Gherkin harness drives the router in process; it needs its own target
# because cucumber supplies `main`.
[[test]]
name = "contracts"
harness = false
