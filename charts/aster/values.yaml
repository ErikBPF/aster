# Defaults are intentional placeholders: `just chart-lint` renders them, and a
# default install needs only the side-loaded Aster image, not a private registry
# or external secret store. Credentials are never values: the chart generates
# them at install time and keeps them in the Secret below, or reads an existing one.

image:
  # Any registry/repository. The default is the image `just build-minikube`
  # builds and side-loads, so a minikube install needs no registry at all.
  repository: aster-server
  tag: local
  # Optional immutable digest; when set it wins over the tag.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""

# In-chart Postgres for a self-contained install. A real deployment points
# `database.host` at a managed instance and sets `postgres.enabled: false`.
postgres:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
  persistence:
    enabled: true
    size: 1Gi
    # Empty uses the cluster's default StorageClass.
    storageClassName: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

database:
  # Empty points at the in-chart Postgres service; set a host to use your own.
  host: ""
  port: 5432
  name: aster
  user: aster
  sslMode: disable

engines:
  - id: trino-local
    kind: trino
    endpoint: http://trino:8080
    routingGroup: ""

catalogs:
  - id: polaris
    kind: polaris
    endpoint: http://polaris:8181
    catalog: quickstart_catalog

server:
  # Browse catalog ID;engine ID;engine-native SQL catalog;policy, comma-separated.
  catalogBindings: polaris;trino-local;polaris;protected
  replicas: 1
  bind: 0.0.0.0:8080
  notebookDir: /data/notebooks
  notebookBranch: session
  contractsDir: /etc/aster/contracts
  # State lifetimes in the shared store: an idle session, an in-flight OIDC
  # handshake, and where a subject left off.
  sessionTtlSeconds: 28800
  handshakeTtlSeconds: 300
  userStateTtlSeconds: 2592000
  # Admin-only shared registrations are opt-in until group/role revocation is
  # enforced. Supply the keyset through a separate existing Kubernetes Secret;
  # never put application keys in chart values.
  sharedModels:
    enabled: false
    allowedOrigins: ""
    activeKey: ""
    keysetSecretName: ""
    # Authority can secure SSO admin management before ordinary model use.
    authorityEnabled: false
    # Remains off until live Authentik removal and grant checks pass.
    useEnabled: false
    authentikApiOrigin: ""
    adminGroupUuid: ""
    editorGroupUuid: ""
    readTokenSecretName: ""
  # Development-only identity seam; leave empty in a real deployment so SSO is
  # the only way in.
  grants: ""
  metricsPort: 9090
  # OTLP endpoint for traces. Empty keeps tracing on stdout.
  otlpEndpoint: ""
  # `none` enables development login for a private throwaway cluster. Configure
  # `oidc` with an issuer before exposing Aster beyond the local dev cluster.
  identity:
    kind: none
    issuer: ""
    clientId: aster
    scopes: openid
    groupsClaim: groups
    redirectUri: http://localhost:8080/callback
    adminGroup: aster-admins
    editorGroup: aster-editors
    userUuidClaim: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

controller:
  enabled: true
  reconcileSeconds: 30
  auditRetentionDays: 30
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

service:
  port: 80

ingress:
  enabled: false
  className: ""
  host: aster.local

persistence:
  enabled: true
  size: 2Gi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce

secrets:
  # Name of an existing Secret holding the database URL, the state URL and the
  # OIDC client credential. When empty the chart generates its own, so a
  # default install needs no external secret store.
  existingSecret: ""

networkPolicy:
  enabled: false
  # Namespaces allowed to reach the server port (for example an ingress
  # controller) and the metrics port (for example a Prometheus operator).
  ingressNamespaces: []
  metricsNamespaces: []
  egressPorts:
    - 8080
    - 8181
    - 5432
    - 6379
    - 443

# Prometheus scraping. Off by default because it needs the prometheus-operator
# CRDs; the labels are the release selector kube-prometheus-stack looks for.
metrics:
  serviceMonitor:
    enabled: false
    labels: {}

# Session and handshake state (D18/D20). One instance for aster alone. The dev
# default has no auth (reachable only inside the cluster); a shared deployment
# sets `auth.enabled: true` and points `usersExistingSecret` at a Secret.
valkey:
  enabled: true
  auth:
    enabled: false
  dataStorage:
    enabled: true
    requestedSize: 1Gi
    # Empty uses the cluster's default StorageClass.
    className: ""
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# Data contracts shipped with the deployment: name -> ODCS-shaped JSON body.
contracts: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
