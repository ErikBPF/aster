{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetName }}
  labels:
    app.kubernetes.io/name: aster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.externalSecret.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: session_key
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: session_key
    - secretKey: database_url
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: database_url
    - secretKey: oidc_client_secret
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: oidc_client_secret
{{- end }}
