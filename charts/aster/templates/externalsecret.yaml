{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.targetName }}
  labels:
    app.kubernetes.io/name: aster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.externalSecret.targetName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: state_url
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: state_url
    - secretKey: database_url
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: database_url
    - secretKey: oidc_client_secret
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: oidc_client_secret
{{- end }}
{{- if and .Values.externalSecret.enabled .Values.valkey.enabled }}
---
# The upstream valkey chart reads the password for the `default` ACL user from
# an existing secret, keyed by the user name. Same Vault entry, one property.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.valkey.auth.usersExistingSecret }}
  labels:
    app.kubernetes.io/name: aster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStore.name }}
    kind: {{ .Values.externalSecret.secretStore.kind }}
  target:
    name: {{ .Values.valkey.auth.usersExistingSecret }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: default
      remoteRef:
        key: {{ .Values.externalSecret.vaultPath }}
        property: valkey_password
{{- end }}
