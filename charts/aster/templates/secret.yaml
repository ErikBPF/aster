{{- if not .Values.secrets.existingSecret }}
{{- $name := include "aster.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $dbPass := "" }}
{{- if $existing }}
{{- $dbPass = index $existing.data "postgres_password" | b64dec }}
{{- else }}
{{- $dbPass = randAlphaNum 24 }}
{{- end }}
{{- $host := include "aster.databaseHost" . }}
{{- if .Values.postgres.enabled }}
{{- $url := printf "postgres://%s:%s@%s:%v/%s?sslmode=%s" .Values.database.user $dbPass $host .Values.database.port .Values.database.name .Values.database.sslMode }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: aster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  # Generated once and kept across upgrades by the lookup above.
  postgres_password: {{ $dbPass | b64enc | quote }}
  database_url: {{ $url | b64enc | quote }}
  state_url: {{ printf "redis://%s:6379" (include "aster.stateHost" .) | b64enc | quote }}
  oidc_client_secret: {{ "" | b64enc | quote }}
{{- else }}
# An external database needs its own credential: set `secrets.existingSecret`
# to a Secret carrying `database_url`, `state_url` and `oidc_client_secret`.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: aster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
type: Opaque
data:
  database_url: {{ printf "postgres://%s@%s:%v/%s?sslmode=%s" .Values.database.user $host .Values.database.port .Values.database.name .Values.database.sslMode | b64enc | quote }}
  state_url: {{ printf "redis://%s:6379" (include "aster.stateHost" .) | b64enc | quote }}
  oidc_client_secret: {{ "" | b64enc | quote }}
{{- end }}
{{- end }}
