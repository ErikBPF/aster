{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
  labels:
    app.kubernetes.io/name: aster
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: aster
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aster
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or .Values.networkPolicy.ingressNamespaces .Values.networkPolicy.metricsNamespaces }}
  ingress:
    {{- range .Values.networkPolicy.ingressNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    # Prometheus targets the pod directly, so the target namespace opens the
    # metrics port to the monitoring namespace itself.
    {{- range .Values.networkPolicy.metricsNamespaces }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: {{ $.Values.server.metricsPort }}
          protocol: TCP
    {{- end }}
  {{- end }}
  egress:
    # DNS.
    - ports:
        - port: 53
          protocol: UDP
    # Data plane: Trino, Polaris, Postgres and the IdP over TLS.
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
