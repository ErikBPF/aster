//! The aster API, in one place.
//!
//! Every method carries a `google.api.http` binding, so the REST shape of the
//! API is machine-readable even though the Rust server serves it through
//! ConnectRPC. That keeps a transcoding proxy (Envoy, grpc-gateway) an
//! operational choice instead of a rewrite.
//!
//! Internal callers use gRPC, the browser and curl use the Connect protocol's
//! JSON encoding, and both come from this one registration.

syntax = "proto3";

package aster.v1;

import "google/api/annotations.proto";

service Aster {
  rpc ExportWorkspaceCheckout(GetWorkspaceCheckoutRequest) returns (WorkspaceExport) {
    option (google.api.http) = { post: "/v1/workspaces/export" body: "*" };
  }
  rpc ImportWorkspaceNotebook(ImportWorkspaceNotebookRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/import-notebook" body: "*" };
  }
  rpc ReconcileWorkspaceRemote(GetWorkspaceStateRequest) returns (WorkspaceRemoteOutcome) {
    option (google.api.http) = { post: "/v1/workspaces/reconcile" body: "*" };
  }
  rpc RunWorkspaceCell(RunWorkspaceCellRequest) returns (QueryResult) {
    option (google.api.http) = { post: "/v1/workspaces/run-cell" body: "*" };
  }
  rpc OpenWorkspacePullRequest(OpenWorkspacePullRequestRequest) returns (WorkspacePullRequest) {
    option (google.api.http) = { post: "/v1/workspaces/open-pr" body: "*" };
  }
  rpc GetWorkspaceState(GetWorkspaceStateRequest) returns (WorkspaceState) {
    option (google.api.http) = { post: "/v1/workspaces/state" body: "*" };
  }
  rpc SaveWorkspaceLayout(SaveWorkspaceLayoutRequest) returns (WorkspaceLayoutVersion) {
    option (google.api.http) = { post: "/v1/workspaces/layout" body: "*" };
  }
  rpc PushWorkspaceCheckout(GetWorkspaceMutationRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/push-workspace-checkout" body: "*" };
  }
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse) {
    option (google.api.http) = { post: "/v1/workspaces/list-workspaces" body: "*" };
  }
  rpc DeleteWorkspace(DeleteWorkspaceRequest) returns (DeleteWorkspaceResponse) {
    option (google.api.http) = { post: "/v1/workspaces/delete-workspace" body: "*" };
  }
  rpc CloneWorkspaceRepository(CloneWorkspaceRepositoryRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/clone-workspace-repository" body: "*" };
  }
  rpc GetWorkspaceCheckout(GetWorkspaceCheckoutRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/get-workspace-checkout" body: "*" };
  }
  rpc GetWorkspaceDraft(GetWorkspaceDraftRequest) returns (WorkspaceDraft) {
    option (google.api.http) = { post: "/v1/workspaces/get-workspace-draft" body: "*" };
  }
  rpc SaveWorkspaceDraft(SaveWorkspaceDraftRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/save-workspace-draft" body: "*" };
  }
  rpc PullWorkspaceCheckout(GetWorkspaceMutationRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/pull-workspace-checkout" body: "*" };
  }
  rpc SwitchWorkspaceBranch(SwitchWorkspaceBranchRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/switch-workspace-branch" body: "*" };
  }
  rpc CommitWorkspaceNotebooks(CommitWorkspaceNotebooksRequest) returns (WorkspaceCheckout) {
    option (google.api.http) = { post: "/v1/workspaces/commit-workspace-notebooks" body: "*" };
  }
  rpc CreateWorkspace(CreateWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = { post: "/v1/workspaces" body: "*" };
  }
  rpc TakeoverWorkspace(TakeoverWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = { post: "/v1/workspaces/takeover" body: "*" };
  }
  rpc OpenWorkspace(OpenWorkspaceRequest) returns (Workspace) {
    option (google.api.http) = { post: "/v1/workspaces/open" body: "*" };
  }
  rpc ConfigureWorkspaceRepository(ConfigureWorkspaceRepositoryRequest) returns (WorkspaceRepository) {
    option (google.api.http) = { post: "/v1/workspace-repositories/configure" body: "*" };
  }
  rpc ListWorkspaceRepositories(ListWorkspaceRepositoriesRequest) returns (ListWorkspaceRepositoriesResponse) {
    option (google.api.http) = { post: "/v1/workspace-repositories/list" body: "*" };
  }

  rpc GetSkillDefaults(GetSkillDefaultsRequest) returns (SkillDefaults) {
    option (google.api.http) = { get: "/v1/ai/skill-defaults" };
  }
  rpc PutSkillDefaults(PutSkillDefaultsRequest) returns (SkillDefaults) {
    option (google.api.http) = { put: "/v1/ai/skill-defaults" body: "*" };
  }
  rpc DiscoverMcpTools(DiscoverMcpToolsRequest) returns (DiscoverMcpToolsResponse) {
    option (google.api.http) = { get: "/v1/ai/mcp-connections/{id}/tools" };
  }
  rpc ApproveMcpRead(ApproveMcpReadRequest) returns (McpConnection) {
    option (google.api.http) = { put: "/v1/ai/mcp-connections/{id}/reads" body: "*" };
  }
  rpc CallMcpTool(CallMcpToolRequest) returns (CallMcpToolResponse) {
    option (google.api.http) = { post: "/v1/ai/mcp-connections/{id}/call" body: "*" };
  }
  rpc ListMcpConnections(ListMcpConnectionsRequest) returns (ListMcpConnectionsResponse) {
    option (google.api.http) = { get: "/v1/ai/mcp-connections" };
  }
  rpc PutMcpConnection(PutMcpConnectionRequest) returns (McpConnection) {
    option (google.api.http) = { put: "/v1/ai/mcp-connections/{id}" body: "*" };
  }
  rpc GetPersonalModelPolicy(GetPersonalModelPolicyRequest) returns (PersonalModelPolicyResponse) {
    option (google.api.http) = { get: "/v1/ai/personal-model-policy" };
  }
  rpc PutPersonalModelPolicy(PutPersonalModelPolicyRequest) returns (PersonalModelPolicyResponse) {
    option (google.api.http) = { put: "/v1/ai/personal-model-policy" body: "*" };
  }
  rpc PutPersonalModel(PutPersonalModelRequest) returns (PersonalModelResponse) {
    option (google.api.http) = { put: "/v1/ai/personal-models/{id}" body: "*" };
  }
  rpc DeletePersonalModel(DeletePersonalModelRequest) returns (DeletePersonalModelResponse) {
    option (google.api.http) = { delete: "/v1/ai/personal-models/{id}" };
  }
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = { get: "/v1/skills" };
  }
  rpc GetSkill(GetSkillRequest) returns (Skill) {
    option (google.api.http) = { get: "/v1/skills/{id}" };
  }
  rpc ListSkillVersions(ListSkillVersionsRequest) returns (ListSkillsResponse) {
    option (google.api.http) = { get: "/v1/skills/{id}/versions" };
  }
  rpc PutSkill(PutSkillRequest) returns (Skill) {
    option (google.api.http) = { post: "/v1/skills" body: "*" };
  }
  rpc DeleteSkill(DeleteSkillRequest) returns (DeleteSkillResponse) {
    option (google.api.http) = { delete: "/v1/skills/{id}" };
  }
  rpc ShareSkill(ShareSkillRequest) returns (Skill) {
    option (google.api.http) = { put: "/v1/skills/{id}/sharing" body: "*" };
  }

  rpc ListCatalogInventory(ListTablesRequest) returns (ContractReadResponse) {
    option (google.api.http) = { post: "/v1/catalog-inventory" body: "*" };
  }
  rpc PrepareContractQuery(ContractSelection) returns (ContractReadResponse) {
    option (google.api.http) = { post: "/v1/contracts/prepare" body: "*" };
  }
  rpc ListContracts(ListContractsRequest) returns (ContractReadResponse) {
    option (google.api.http) = { get: "/v1/contracts" };
  }
  rpc GetContract(ContractSelection) returns (ContractReadResponse) {
    option (google.api.http) = { post: "/v1/contracts/read" body: "*" };
  }
  rpc GetConversation(GetConversationRequest) returns (Conversation) {
    option (google.api.http) = { get: "/v1/notebooks/{notebook}/conversation" };
  }
  rpc SendMessage(SendMessageRequest) returns (Conversation) {
    option (google.api.http) = { post: "/v1/notebooks/{notebook}/conversation" body: "*" };
  }
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse) {
    option (google.api.http) = { get: "/v1/notebooks/{notebook}/conversations" };
  }
  rpc DeleteConversation(DeleteConversationRequest) returns (DeleteConversationResponse) {
    option (google.api.http) = { delete: "/v1/notebooks/{notebook}/conversations/{session}" };
  }
  rpc NewConversation(NewConversationRequest) returns (Conversation) {
    option (google.api.http) = {
      post: "/v1/notebooks/{notebook}/conversations"
      body: "*"
    };
  }

  // Working state of the caller. The subject comes from the session, never
  // from the request.
  rpc GetState(GetStateRequest) returns (WorkingState) {
    option (google.api.http) = {
      get: "/v1/state"
    };
  }

  rpc PutState(PutStateRequest) returns (WorkingState) {
    option (google.api.http) = {
      patch: "/v1/state"
      body: "*"
    };
  }

  rpc GetNotebookHelper(GetNotebookHelperRequest) returns (NotebookHelper) {
    option (google.api.http) = { get: "/v1/notebooks/{notebook}/helper" };
  }

  rpc PutNotebookHelper(PutNotebookHelperRequest) returns (NotebookHelper) {
    option (google.api.http) = { put: "/v1/notebooks/{notebook}/helper" body: "*" };
  }

  rpc ListEngines(ListEnginesRequest) returns (ListEnginesResponse) {
    option (google.api.http) = {
      get: "/v1/engines"
    };
  }

  rpc ListCatalogs(ListCatalogsRequest) returns (ListCatalogsResponse) {
    option (google.api.http) = {
      get: "/v1/catalogs"
    };
  }

  rpc ListTables(ListTablesRequest) returns (ListTablesResponse) {
    option (google.api.http) = {
      get: "/v1/catalogs/{catalog}/namespaces/{namespace}/tables"
    };
  }

  rpc ListNotebooks(ListNotebooksRequest) returns (ListNotebooksResponse) {
    option (google.api.http) = {
      get: "/v1/notebooks"
    };
  }

  rpc GetNotebook(GetNotebookRequest) returns (Notebook) {
    option (google.api.http) = {
      get: "/v1/notebooks/{id}"
    };
  }

  rpc ListNotebookRevisions(GetNotebookRequest) returns (NotebookRevisions) {}
  rpc GetNotebookRevision(GetNotebookRevisionRequest) returns (NotebookRevision) {}
  rpc RestoreNotebookRevision(RestoreNotebookRevisionRequest) returns (SaveNotebookResponse) {}

  rpc SaveNotebook(SaveNotebookRequest) returns (SaveNotebookResponse) {
    option (google.api.http) = {
      put: "/v1/notebooks/{id}"
      body: "notebook"
    };
  }

  rpc AssignNotebookOwner(AssignNotebookOwnerRequest) returns (AssignNotebookOwnerResponse) {
    option (google.api.http) = { put: "/v1/admin/notebooks/{id}/owner" body: "*" };
  }

  rpc RunQuery(RunQueryRequest) returns (QueryResult) {
    option (google.api.http) = {
      post: "/v1/query"
      body: "*"
    };
  }

  // Renders a table's metadata as the file a team commits: a Cube model for the
  // semantic layer, or an Open Data Contract Standard document.
  rpc RenderSemantic(RenderSemanticRequest) returns (RenderSemanticResponse) {
    option (google.api.http) = {
      get: "/v1/semantic/{target}/{catalog}/{namespace}/{table}"
    };
  }

  // The notebook session exchange. Every operation is scoped to one notebook
  // and none of them reads a cell conversation.
  rpc FetchQuery(FetchQueryRequest) returns (FetchQueryResponse) {
    option (google.api.http) = {
      get: "/v1/notebooks/{notebook}/cells/{cell}/query"
    };
  }

  rpc FetchResult(FetchResultRequest) returns (FetchResultResponse) {
    option (google.api.http) = {
      get: "/v1/notebooks/{notebook}/cells/{cell}/result"
    };
  }

  rpc UpdateQuery(UpdateQueryRequest) returns (UpdateQueryResponse) {
    option (google.api.http) = {
      post: "/v1/notebooks/{notebook}/cells/{cell}/query"
      body: "*"
    };
  }

  rpc FetchSummary(FetchSummaryRequest) returns (FetchSummaryResponse) {
    option (google.api.http) = {
      get: "/v1/notebooks/{notebook}/summary"
    };
  }

  rpc SendSummary(SendSummaryRequest) returns (SendSummaryResponse) {
    option (google.api.http) = {
      post: "/v1/notebooks/{notebook}/summary"
      body: "*"
    };
  }
}

message ListContractsRequest {}
message ContractSelection {
  string path = 1;
  string sha256 = 2;
  string object = 3;
}
message ContractReadResponse {
  string context_json = 1;
}

message GetStateRequest {}

message PutStateRequest {
  optional string notebook = 1;
  optional string cell = 2;
  optional string engine = 3;
}

message WorkingState {
  optional string notebook = 1;
  optional string cell = 2;
  optional string engine = 3;
}

message GetNotebookHelperRequest {
  string notebook = 1;
  optional string team = 2;
  optional string workspace = 3;
}
message PutNotebookHelperRequest {
  string notebook = 1;
  string helper = 2;
  optional string team = 3;
  optional string workspace = 4;
}
message NotebookHelper {
  string notebook = 1;
  optional string helper = 2;
}

message ListEnginesRequest {
  optional string catalog_context = 1;
}

message Engine {
  string id = 1;
  string kind = 2;
  string endpoint = 3;
  string routing_group = 4;
  string health = 5;
}

message ListEnginesResponse {
  repeated Engine engines = 1;
}

message ListCatalogsRequest {}

message Catalog {
  string id = 1;
  string kind = 2;
  string health = 3;
}

message ListCatalogsResponse {
  repeated Catalog catalogs = 1;
}

message ListTablesRequest {
  string catalog = 1;
  string namespace = 2;
  repeated string namespace_segments = 3;
}

message TableDescriptor {
  string namespace = 1;
  string name = 2;
  optional string format = 3;
  optional string base_location = 4;
  optional bool schema_available = 5;
  repeated string namespace_segments = 6;
}

message ListTablesResponse {
  repeated TableDescriptor tables = 1;
}

message ListNotebooksRequest {
  optional string team = 1;
  optional string workspace = 2;
}

message ListNotebooksResponse {
  repeated string ids = 1;
}

message GetNotebookRequest {
  string id = 1;
  optional string team = 2;
  optional string workspace = 3;
}

message NotebookRevisions { repeated string revisions = 1; }
message GetNotebookRevisionRequest {
  string id = 1;
  string revision = 2;
  optional string team = 3;
  optional string workspace = 4;
}
message RestoreNotebookRevisionRequest {
  string id = 1;
  string revision = 2;
  string expected_content_revision = 3;
  optional string team = 4;
  optional string workspace = 5;
}
message NotebookRevision { string notebook_json = 1; }

message Cell {
  string id = 1;
  string sql = 2;
  optional string engine = 3;
}

message NotebookContext {
  optional string catalog_context = 1;
  optional string schema = 2;
}

message Notebook {
  string id = 1;
  string title = 2;
  repeated Cell cells = 3;
  optional string content_revision = 4;
  // One engine for the whole notebook. Saving it makes per-cell engines
  // legacy; the server refuses a run that names a different engine.
  optional string engine = 5;
  NotebookContext context = 6;
}

message SaveNotebookRequest {
  string id = 1;
  Notebook notebook = 2;
  optional string expected_content_revision = 3;
  bool if_absent = 4;
}

message SaveNotebookResponse {
  string revision = 1;
  string content_revision = 2;
}

message AssignNotebookOwnerRequest {
  string id = 1;
  string owner = 2;
  string expected_content_revision = 3;
  optional string expected_owner = 4;
  optional string reason = 5;
}

message AssignNotebookOwnerResponse {}

message RunQueryRequest {
  string sql = 1;
  optional string engine = 2;
  // Engine-native SQL catalog alias retained for existing callers.
  optional string catalog = 3;
  optional string schema = 4;
  optional uint32 max_rows = 5;
  // Selected browse catalog instance; the server validates its engine binding.
  optional string catalog_context = 6;
  // The notebook and cell this run belongs to. When both are set, the server
  // records the cell's last result for the notebook session exchange.
  optional string notebook = 7;
  optional string cell = 8;
}

message Column {
  string name = 1;
  string data_type = 2;
}

message QueryResult {
  repeated Column columns = 1;
  // Rows are the engine's JSON values, one encoded array per row, because the
  // engines type their columns at runtime and not at compile time.
  repeated string rows_json = 2;
  bool truncated = 3;
}

message RenderSemanticRequest {
  // "cube" or "odcs".
  string target = 1;
  string catalog = 2;
  string namespace = 3;
  string table = 4;
  repeated string namespace_segments = 5;
}

message RenderSemanticResponse {
  string target = 1;
  // Suggested repository path for the rendered file.
  string path = 2;
  string content = 3;
}

message GetConversationRequest {
  string notebook = 1;
  optional string team = 2;
  optional string workspace = 3;
  // Cell-scoped conversation. The key becomes notebook+cell, so a cell
  // conversation never shares history with the notebook conversation or
  // with another cell. Absent means the notebook conversation itself.
  optional string cell = 4;
  // Specific session id. Absent selects the latest session for the scope.
  optional string session = 5;
}
message SendMessageRequest {
  string notebook = 1;
  string helper = 2;
  string prompt = 3;
  string context = 4;
  optional int64 expected_revision = 5;
  optional string team = 6;
  optional string workspace = 7;
  optional string cell = 8;
  optional ContractSelection contract_selection = 9;
  // Session to append to. Absent appends to the latest session.
  optional string session = 10;
  optional SkillSelection skill = 11;
  optional SkillSelections selected_skills = 12;
  optional McpSelections selected_mcp = 13;
  string tool_confirmation = 14;
  bool cancel_tool_turn = 15;
}
message ListConversationsRequest {
  string notebook = 1;
  optional string team = 2;
  optional string workspace = 3;
  optional string cell = 4;
}
message ConversationSummary {
  string id = 1;
  // Short phrase from the first user message; "New session" until then.
  string phrase = 2;
  int64 created_at_ms = 3;
  int64 updated_at_ms = 4;
  int32 message_count = 5;
  int64 revision = 6;
}
message ListConversationsResponse {
  repeated ConversationSummary sessions = 1;
}
message DeleteConversationResponse {}
message DeleteConversationRequest {
  string notebook = 1;
  string session = 2;
  optional int64 expected_revision = 3;
  optional string team = 4;
  optional string workspace = 5;
  optional string cell = 6;
}
message NewConversationRequest {
  string notebook = 1;
  optional string team = 2;
  optional string workspace = 3;
  optional string cell = 4;
}
message ChatMessage {
  string role = 1;
  string content = 2;
  string helper = 3;
  repeated SkillSelection skills = 4;
  repeated string mcp_connections = 5;
}
message Conversation {
  string id = 1;
  int64 revision = 2;
  repeated ChatMessage messages = 3;
  optional PendingNotebookTool pending_tool = 4;
}

message FetchQueryRequest {
  string notebook = 1;
  string cell = 2;
}
message FetchQueryResponse {
  string sql = 1;
  string content_revision = 2;
}
message FetchResultRequest {
  string notebook = 1;
  string cell = 2;
}
message FetchResultResponse {
  repeated string columns = 1;
  repeated string rows_json = 2;
  bool truncated = 3;
}
message UpdateQueryRequest {
  string notebook = 1;
  string cell = 2;
  string sql = 3;
  // The content revision the caller read; a stale one is refused as a conflict.
  string expected_content_revision = 4;
}
message UpdateQueryResponse {
  string content_revision = 1;
}
message NotebookCell {
  string id = 1;
  string sql = 2;
}
message FetchSummaryRequest {
  string notebook = 1;
}
message FetchSummaryResponse {
  optional string summary = 1;
  repeated NotebookCell cells = 2;
}
message SendSummaryRequest {
  string notebook = 1;
  string summary = 2;
}
message SendSummaryResponse {
  string summary = 1;
}

// Registration does not activate a checkout. Authority comes from current team policy.
message ConfigureWorkspaceRepositoryRequest {
  string team = 1;
  string repository = 2;
  string default_branch = 3;
  optional uint64 expected_version = 4;
  bool if_absent = 5;
}
message ListWorkspaceRepositoriesRequest { string team = 1; }
message WorkspaceRepository {
  string team = 1;
  string repository = 2;
  uint64 repository_id = 3;
  string default_branch = 4;
  string default_commit = 5;
  uint64 version = 6;
}
message ListWorkspaceRepositoriesResponse { repeated WorkspaceRepository repositories = 1; }

message CreateWorkspaceRequest { string name = 1; }
message OpenWorkspaceRequest { string workspace = 1; optional string writer_token = 2; }
message Workspace {
  string id = 1;
  string name = 2;
  uint64 epoch = 3;
  bool read_only = 4;
  optional string writer_token = 5;
  bool deleting = 6;
}

message TakeoverWorkspaceRequest { string workspace = 1; uint64 expected_epoch = 2; }

message CloneWorkspaceRepositoryRequest {
  string workspace = 1;
  string writer_token = 2;
  uint64 epoch = 3;
  string team = 4;
  uint64 repository_id = 5;
  string branch = 6;
}
message GetWorkspaceCheckoutRequest { string workspace = 1; string checkout = 2; }
message GetWorkspaceDraftRequest { string workspace = 1; string checkout = 2; string notebook = 3; }
message WorkspaceDraft {
  string notebook_json = 1;
  string revision = 2;
  uint64 checkout_version = 3;
  string branch = 4;
}
message WorkspaceCheckout {
  string id = 1;
  string workspace = 2;
  string team = 3;
  string repository = 4;
  string branch = 5;
  uint64 version = 6;
  string head = 7;
  bool dirty = 8;
  repeated string notebooks = 9;
  optional string draft_revision = 10;
}
message SaveWorkspaceDraftRequest {
  string workspace = 1;
  string checkout = 2;
  string writer_token = 3;
  uint64 epoch = 4;
  uint64 expected_version = 5;
  string notebook_json = 6;
  optional string expected_draft_revision = 7;
  bool if_absent = 8;
}
message CommitWorkspaceNotebooksRequest {
  string workspace = 1;
  string checkout = 2;
  string writer_token = 3;
  uint64 epoch = 4;
  uint64 expected_version = 5;
  repeated string notebooks = 6;
  string message = 7;
}

message SwitchWorkspaceBranchRequest {
  string workspace = 1;
  string checkout = 2;
  string writer_token = 3;
  uint64 epoch = 4;
  uint64 expected_version = 5;
  string branch = 6;
  bool create = 7;
}

message GetWorkspaceMutationRequest {
  string workspace = 1;
  string checkout = 2;
  string writer_token = 3;
  uint64 epoch = 4;
  uint64 expected_version = 5;
}

message ListWorkspacesResponse { repeated Workspace workspaces = 1; uint64 max_workspaces = 2; }
message DeleteWorkspaceRequest { string workspace = 1; string writer_token = 2; uint64 epoch = 3; }

message ListWorkspacesRequest {}
message DeleteWorkspaceResponse {}

message GetWorkspaceStateRequest { string workspace = 1; }
message WorkspaceState {
  repeated string checkouts = 1;
  string layout_json = 2;
  uint64 layout_version = 3;
  uint64 recovery_bytes = 4;
  uint64 total_checkouts = 5;
  uint64 max_checkouts = 6;
  uint64 max_checkout_bytes = 7;
}
message SaveWorkspaceLayoutRequest {
  string workspace = 1;
  string writer_token = 2;
  uint64 epoch = 3;
  uint64 expected_version = 4;
  string layout_json = 5;
}
message WorkspaceLayoutVersion { uint64 version = 1; }

message RunWorkspaceCellRequest {
  string workspace = 1;
  string checkout = 2;
  string notebook = 3;
  string cell = 4;
  uint64 expected_version = 5;
}
message OpenWorkspacePullRequestRequest {
  string workspace = 1;
  string checkout = 2;
  string writer_token = 3;
  uint64 epoch = 4;
  uint64 expected_version = 5;
  string title = 6;
}
message WorkspacePullRequest { string url = 1; }

message WorkspaceRemoteOutcome {
  WorkspaceCheckout checkout = 1;
  optional string pull_request = 2;
}

message ImportWorkspaceNotebookRequest {
  string workspace = 1;
  string checkout = 2;
  string writer_token = 3;
  uint64 epoch = 4;
  uint64 expected_version = 5;
  string notebook = 6;
  string expected_legacy_revision = 7;
}

message WorkspaceExport { bytes archive = 1; }

message SkillSelection {
  string id = 1;
  int64 revision = 2;
}
message SkillReference {
  string name = 1;
  string content = 2;
}
message Skill {
  string id = 1;
  string owner = 2;
  string title = 3;
  int64 revision = 4;
  int64 sharing_revision = 5;
  string audience = 6;
  optional string team = 7;
  string instructions = 8;
  repeated SkillReference references = 9;
  string author = 10;
  int64 created_at_ms = 11;
  bool can_edit = 12;
