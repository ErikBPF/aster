"686" y="1332" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#132A46">Starlight</text><text x="686" y="1364" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#132A46">#C3C0FF</text><rect x="962" y="1162" width="250" height="130" rx="16" fill="#6658B8"/><text x="962" y="1332" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#132A46">Deep violet</text><text x="962" y="1364" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#132A46">#6658B8</text><rect x="1238" y="1162" width="250" height="130" rx="16" fill="#FFFFFF"/><text x="1238" y="1332" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#132A46">White</text><text x="1238" y="1364" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#132A46">#FFFFFF</text><text x="90" y="1449" font-family="DejaVu Sans,sans-serif" font-size="20" font-weight="600" fill="#041F43">03  /  USE WITH CARE</text><text x="90" y="1496" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#132A46">Keep the diagonal A cut and the raised star as one fixed lockup.</text><text x="90" y="1538" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#132A46">Leave at least one star diameter of clear space around the artwork.</text><text x="90" y="1580" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#132A46">Use the full wordmark at 160 px wide or larger; use the star for small icons.</text><text x="90" y="1622" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#132A46">Keep every star arm and its center the same solid color. No gradients.</text><text x="90" y="1664" font-family="DejaVu Sans,sans-serif" font-size="23" font-weight="400" fill="#132A46">Use the deep-violet star on light backgrounds for stronger contrast.</text><text x="90" y="1760" font-family="DejaVu Sans,sans-serif" font-size="19" font-weight="400" fill="#132A46">Wordmark: custom vector outlines  ·  Product UI: system sans  ·  SQL: monospace</text><text x="90" y="1797" font-family="DejaVu Sans,sans-serif" font-size="17" font-weight="400" fill="#58677B">Digital-first starter identity / SVG · PNG · ICO / v1.0</text></svg>