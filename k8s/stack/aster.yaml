# The aster half of the self-contained dev stack: its metadata Postgres, its
# Valkey and the server itself. Deployed by `just stack-up <profile>` (devspace).
#
# Local-only: inline dev secrets, no Vault, no ingress. The server image is built
# by `just build-minikube` and side-loaded into minikube, so it carries no digest
# yet. The shared-cluster path (published image digests, ExternalSecret,
# NetworkPolicy) lives in the Helm chart under charts/aster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres
  namespace: aster
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:17-alpine
          env:
            - name: POSTGRES_DB
              value: aster
            - name: POSTGRES_USER
              value: aster
            - name: POSTGRES_PASSWORD
              value: aster
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "aster"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aster
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey
  namespace: aster
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: aster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      securityContext:
        # The upstream valkey image runs as root, like the postgres one above.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.2-alpine
          args: ["valkey-server", "--requirepass", "aster-dev", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["valkey-cli", "-a", "aster-dev", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            # No capability drop: the image's entrypoint chowns /data and drops
            # privileges itself, which needs CAP_CHOWN/CAP_SETUID.
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: valkey
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: aster
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aster-server
  namespace: aster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aster-server
  template:
    metadata:
      labels:
        app: aster-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: aster-server:local
          imagePullPolicy: IfNotPresent
          env:
            - name: ASTER_BIND
              value: 0.0.0.0:8080
            - name: DATABASE_URL
              value: postgres://aster:aster@postgres:5432/aster
            - name: ASTER_STATE_URL
              value: redis://:aster-dev@valkey:6379
            - name: ASTER_DEV_LOGIN
              value: "1"
            # The compute backends in k8s/stack: Trino through the gateway (so the
            # routing group is exercised) and this stack's own Spark Connect.
            - name: ASTER_ENGINES
              value: trino-gw;trino;http://trino-gateway.trino.svc.cluster.local:8080;lab,spark-live;spark;http://spark-connect-aster.spark-jobs.svc.cluster.local:15002
            - name: ASTER_DEFAULT_ENGINE
              value: trino-gw
            # The Iceberg REST catalog this stack seeds (see k8s/stack/polaris.yaml).
            # The id matches the Trino connector name in k8s/stack/trino.yaml, so
            # it is also the qualifier a cell types: `polaris.sales.part`.
            # Last field is the OAuth2 client id:secret aster exchanges for a token.
            - name: ASTER_CATALOGS
              value: polaris;polaris;http://polaris.polaris.svc.cluster.local:8181;quickstart_catalog;;root:s3cr3t
            - name: ASTER_DEFAULT_CATALOG
              value: polaris
            - name: ASTER_GRANTS
              value: alice:trino-gw,alice:spark-live
            # The notebook emptyDir is root-owned while the server runs as 65532,
            # so git's dubious-ownership check would refuse it. Scope the
            # exception to that one path instead of running the pod as root.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /data/notebooks
            - name: ASTER_NOTEBOOK_DIR
              value: /data/notebooks
            - name: ASTER_CONTRACTS_DIR
              value: /etc/aster/contracts
            - name: ASTER_METRICS_BIND
              value: 0.0.0.0:9090
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: notebooks
              mountPath: /data/notebooks
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: notebooks
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aster-server
  namespace: aster
spec:
  selector:
    app: aster-server
  ports:
    - name: http
      port: 80
      targetPort: http
