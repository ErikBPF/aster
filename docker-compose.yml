# Self-contained shell/UI stack: metadata database, session state, API server,
# the reconcile controller and a Keycloak used only to evaluate the identity
# port. It runs on mock engine and catalog providers, so it needs no compute
# backends — for the real Trino/Spark path use the minikube stack
# (`just stack-bootstrap`). Images are fully qualified so podman short-name
# resolution never bites; Keycloak lives on quay.io, which is why it is picked
# directly rather than through a registry proxy.
services:
  valkey:
    image: docker.io/valkey/valkey:9.1.2-alpine
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:-aster-dev}"]
    ports:
      - "${ASTER_STATE_PORT:-6379}:6379"
    volumes:
      - state:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD:-aster-dev} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aster}
      POSTGRES_DB: ${POSTGRES_DB:-aster}
    ports:
      - "${ASTER_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aster}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The second identity provider, for the port evaluation. Dev mode, realm
  # imported from keycloak/aster-realm.json. Start-dev leaves the hostname
  # dynamic, so the browser and a host-run server both reach it as
  # http://localhost:${ASTER_IDP_PORT:-8090}. See README for the login recipe.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-aster-dev-admin}
    ports:
      - "${ASTER_IDP_PORT:-8090}:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: aster-server:local
    environment:
      ASTER_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-aster}:${POSTGRES_PASSWORD:-aster}@postgres:5432/${POSTGRES_DB:-aster}
      ASTER_ENGINES: ${ASTER_ENGINES:-mock-local;mock;local}
      ASTER_CATALOGS: ${ASTER_CATALOGS:-mock-local;mock;local}
      ASTER_GRANTS: ${ASTER_GRANTS:-alice:mock-local}
      ASTER_NOTEBOOK_DIR: /data/notebooks
      ASTER_CONTRACTS_DIR: /etc/aster/contracts
      ASTER_STATE_URL: redis://:${VALKEY_PASSWORD:-aster-dev}@valkey:6379
      ASTER_SESSION_TTL_SECONDS: ${ASTER_SESSION_TTL_SECONDS:-28800}
      ASTER_HANDSHAKE_TTL_SECONDS: ${ASTER_HANDSHAKE_TTL_SECONDS:-300}
      ASTER_USER_STATE_TTL_SECONDS: ${ASTER_USER_STATE_TTL_SECONDS:-2592000}
      ASTER_DEV_LOGIN: ${ASTER_DEV_LOGIN:-1}
      ASTER_METRICS_BIND: 0.0.0.0:9090
      # Empty keeps traces on stdout; set it to the collector, e.g.
      # http://otel-collector:4318 for the lab.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "${ASTER_PORT:-8080}:8080"
      - "${ASTER_METRICS_PORT:-9090}:9090"
    volumes:
      - notebooks:/data/notebooks
      - ./contracts:/etc/aster/contracts:ro
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  controller:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: aster-server:local
    # entrypoint, not command: the image sets an exec-form ENTRYPOINT, so CMD
    # would be appended as arguments to aster-server instead of replacing it.
    entrypoint: ["/usr/local/bin/aster-controller"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aster}:${POSTGRES_PASSWORD:-aster}@postgres:5432/${POSTGRES_DB:-aster}
      ASTER_ENGINES: ${ASTER_ENGINES:-mock-local;mock;local}
      ASTER_CATALOGS: ${ASTER_CATALOGS:-mock-local;mock;local}
      ASTER_RECONCILE_SECONDS: ${ASTER_RECONCILE_SECONDS:-30}
      ASTER_AUDIT_RETENTION_DAYS: ${ASTER_AUDIT_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  notebooks:
  state:
